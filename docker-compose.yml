services:
  postgres:
    image: postgres:16
    container_name: inpharmy_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inpharmy_erp
      POSTGRES_USER: inpharmy
      POSTGRES_PASSWORD: inpharmy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inpharmy -d inpharmy_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
